<!DOCTYPE html>
<html>
<head>
  <title>Student Feedback</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    form, .feedback-list { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; }
    button { padding: 10px 20px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .feedback-item { border-bottom: 1px solid #ddd; padding: 10px 0; }
    .timestamp { color: gray; font-size: 12px; }
  </style>
</head>
<body>

  <h2>Submit Your Feedback</h2>

  <form id="feedbackForm">
    <input type="text" id="name" placeholder="Your Name" required><br>
    <textarea id="message" placeholder="Your Feedback" required></textarea><br>
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <div class="feedback-list" id="feedbackList">
    <h3>Previous Feedback</h3>
    <!-- Feedback items will appear here -->
  </div>

  <script>
    const SUPABASE_URL = "https://vqsjewzbrgtwmyfflnqz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxc2pld3picmd0d215ZmZsbnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU5OTg4NDcsImV4cCI6MjA2MTU3NDg0N30.Gqp3kHER4V-DMhRjVF0hVp0WCquPmut1zsUV3ZujURM";

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Submit feedback
    document.getElementById("feedbackForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const message = document.getElementById("message").value;

      const { data, error } = await supabaseClient
        .from("feedback")
        .insert([{ Name: name, Message: message }]);

      if (error) {
        document.getElementById("status").innerText = "Error: " + error.message;
      } else {
        document.getElementById("status").innerText = "Feedback submitted!";
        document.getElementById("feedbackForm").reset();
        fetchFeedback(); // Refresh feedback list
      }
    });

    // Fetch and display feedback
    async function fetchFeedback() {
      const { data, error } = await supabaseClient
        .from("feedback")
        .select("*")
        .order("id", { ascending: false });

      const feedbackList = document.getElementById("feedbackList");
      feedbackList.innerHTML = "<h3>Previous Feedback</h3>";

      if (error) {
        feedbackList.innerHTML += "<p>Error loading feedback.</p>";
        return;
      }

      data.forEach(item => {
        const feedbackItem = document.createElement("div");
        feedbackItem.classList.add("feedback-item");
        feedbackItem.innerHTML = `
          <strong>${item.Name}</strong><br>
          ${item.Message}<br>
          <span class="timestamp">${new Date(item.created_at).toLocaleString()}</span>
        `;
        feedbackList.appendChild(feedbackItem);
      });
    }

    // Initial load
    fetchFeedback();
  </script>

</body>
</html>
