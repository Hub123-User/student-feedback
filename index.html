<body>
  <h2>Submit Your Feedback</h2>
  <form id="feedbackForm">
    <input type="text" id="name" placeholder="Your Name" required><br><br>
    <textarea id="message" placeholder="Your Feedback" required></textarea><br><br>
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <hr>
  <h3>Previous Feedback</h3>
  <ul id="feedbackList"></ul> <!-- List to display feedback -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const SUPABASE_URL = "https://vqsjewzbrgtwmyfflnqz.supabase.co";
    const SUPABASE_ANON_KEY = "your-anon-key-here";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Submit feedback
    document.getElementById("feedbackForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const message = document.getElementById("message").value;

      const { error } = await supabase
        .from("feedback")
        .insert([{ Name: name, Message: message }]);

      if (error) {
        document.getElementById("status").innerText = "Error: " + error.message;
      } else {
        document.getElementById("status").innerText = "Feedback submitted!";
        document.getElementById("feedbackForm").reset();
        fetchFeedback(); // refresh list after submission
      }
    });

    // Fetch and display feedback
    async function fetchFeedback() {
      const { data, error } = await supabase
        .from("feedback")
        .select("*")
        .order("id", { ascending: false }); // latest first

      const list = document.getElementById("feedbackList");
      list.innerHTML = ""; // clear old data

      if (error) {
        list.innerHTML = "<li>Error loading feedback.</li>";
      } else {
        data.forEach(item => {
          const date = new Date(item.created_at).toLocaleString();
          const li = document.createElement("li");
          li.textContent = `${item.Name}: ${item.Message} — [${date}]`;
          list.appendChild(li);
        });
      }
    }

    // Load feedback on page load
    fetchFeedback();
  </script>
</body>
