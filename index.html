<!DOCTYPE html>
<html>
<head>
  <title>Student Feedback</title>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://vqsjewzbrgtwmyfflnqz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxc2pld3picmd0d215ZmZsbnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU5OTg4NDcsImV4cCI6MjA2MTU3NDg0N30.Gqp3kHER4V-DMhRjVF0hVp0WCquPmut1zsUV3ZujURM";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("feedbackForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const message = document.getElementById("message").value;

        const { data, error } = await supabase
          .from("feedback")
          .insert([{ Name: name, Message: message }]);

        if (error) {
          document.getElementById("status").innerText = "Error: " + error.message;
        } else {
          document.getElementById("status").innerText = "✅ Feedback submitted!";
          document.getElementById("feedbackForm").reset();
        }
      });
    });
  </script>
</head>
<body>
  <h2>Submit Your Feedback</h2>
  <form id="feedbackForm">
    <input type="text" id="name" placeholder="Your Name" required><br><br>
    <textarea id="message" placeholder="Your Feedback" required></textarea><br><br>
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>
</body>
</html>
